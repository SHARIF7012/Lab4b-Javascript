
<!DOCTYPE html>
<html>
<head>
    <title>Question 3</title>
</head>
<body>

    <p id="demo"></p>

    <script>
        let text = "";

        // Display numbers from 1 to 5
        for (let i = 1; i <= 5; i++) {
            text += "The number is " + i + "<br>";
        }

        document.getElementById("demo").innerHTML = text;
    </script>

</body>
</html>
